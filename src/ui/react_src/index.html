<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="./src/assets/CosmoLightLogoIcon.ico">
  <title>CosmoLights</title>
  <script>
    window.onerror = function (msg, url, lineNo, columnNo, error) {
      var box = document.getElementById('debug-box');
      if (!box) {
        box = document.createElement('div');
        box.id = 'debug-box';
        box.style = 'position:fixed;top:0;left:0;right:0;bottom:0;background:#18060a;color:#ff6b81;padding:24px;font-family:monospace;font-size:14px;z-index:999999;overflow:auto;white-space:pre-wrap;';
        document.body.appendChild(box);
      }
      box.innerHTML += '<strong>[Global Error]</strong> ' + msg + '<br>' + (url || '') + ':' + lineNo + ':' + columnNo + '<br><pre>' + (error && error.stack ? error.stack : '') + '</pre><br>';
      return false;
    };
    window.onunhandledrejection = function (event) {
      var box = document.getElementById('debug-box');
      if (!box) {
        box = document.createElement('div');
        box.id = 'debug-box';
        box.style = 'position:fixed;top:0;left:0;right:0;bottom:0;background:#18060a;color:#ff6b81;padding:24px;font-family:monospace;font-size:14px;z-index:999999;overflow:auto;white-space:pre-wrap;';
        document.body.appendChild(box);
      }
      box.innerHTML += '<strong>[Unhandled Rejection]</strong> ' + (event.reason ? (event.reason.stack || event.reason) : event.reason) + '<br>';
    };
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./src/main.jsx"></script>
</body>
</html>
